name: CI

on:
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/ci.yml']
  push:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/ci.yml']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/SatelliteTracker.sln

      - name: Build
        run: dotnet build ./backend/SatelliteTracker.sln --no-restore

      - name: Test
        run:  dotnet test ./backend/SatelliteTracker.sln --no-build --verbosity normal

  # Builds both Docker images (backend/Dockerfile) to catch a broken image early. Build only:
  # nothing is pushed and there is no registry login. Each target has its own GitHub Actions
  # cache scope, so one build's cache export doesn't replace the other's.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrator
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
