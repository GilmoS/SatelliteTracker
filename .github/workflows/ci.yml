name: CI

on:
  push:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/SatelliteTracker.sln

      - name: Build
        run: dotnet build ./backend/SatelliteTracker.sln --no-restore

      - name: Test
        run:  dotnet test ./backend/SatelliteTracker.sln --no-build --verbosity normal